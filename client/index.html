<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="The Daily Ham — Fresh Cuts Daily. NHL & NFL odds boards, matchup calculators, hot streaks, rosters and standings." />
    <link rel="icon" href="/logo.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#14100b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily Ham" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>The Daily Ham — NHL & NFL · Fresh Cuts Daily</title>
  </head>
  <body>
    <div id="dh-splash" aria-hidden="true">
        <style>
          #dh-splash { position: fixed; inset: 0; z-index: 9999; transition: opacity .35s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #14100b; color: #f5efe4; font-family: Georgia, 'Times New Roman', serif; text-align: center; padding: 24px; }
          #dh-splash .splash-logo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #c97b2d; box-shadow: 0 8px 40px rgba(0,0,0,.5); animation: splash-in .5s ease; }
          #dh-splash h1 { margin: 6px 0 0; font-size: 34px; letter-spacing: .02em; animation: splash-in .5s ease .1s both; }
          #dh-splash p { margin: 0; font-size: 13px; letter-spacing: .28em; text-transform: uppercase; color: #d8c8b3; animation: splash-in .5s ease .2s both; }
          #dh-splash .splash-dots { display: flex; gap: 8px; margin-top: 18px; }
          #dh-splash .splash-dots i { width: 9px; height: 9px; border-radius: 50%; background: #c97b2d; animation: splash-pulse 1.1s ease infinite; }
          #dh-splash .splash-dots i:nth-child(2) { animation-delay: .18s; }
          #dh-splash .splash-dots i:nth-child(3) { animation-delay: .36s; }
          @keyframes splash-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
          @keyframes splash-pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
          @media (prefers-reduced-motion: reduce) { #dh-splash .splash-logo, #dh-splash h1, #dh-splash p { animation: none; } #dh-splash .splash-dots i { animation: none; opacity: .7; } }
        </style>
        <img class="splash-logo" src="/logo.jpg" alt="" />
        <h1>The Daily Ham</h1>
        <p>Fresh Cuts Daily</p>
        <div class="splash-dots"><i></i><i></i><i></i></div>
      </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
