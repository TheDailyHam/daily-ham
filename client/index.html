<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="The Daily Ham — Fresh Cuts Daily. NHL, NFL, NBA & soccer odds boards, matchup calculators, hot streaks, rosters and standings." />
    <link rel="icon" href="/logo.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#14100b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily Ham" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>The Daily Ham — NHL, NFL, NBA & Soccer · Fresh Cuts Daily</title>
  </head>
  <body>
    <div id="dh-splash" aria-hidden="true">
        <style>
          #dh-splash { position: fixed; inset: 0; z-index: 9999; transition: opacity .35s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #f5efe4; font-family: Georgia, 'Times New Roman', serif; text-align: center; padding: 24px; background: radial-gradient(90% 70% at 50% 30%, #2c2114 0%, #14100b 62%, #0b0805 100%); overflow: hidden; }
          #dh-splash::before { content: ""; position: absolute; inset: -40%; background: linear-gradient(105deg, transparent 42%, color-mix(in srgb, var(--accent) 26%, #ffffff) 47%, rgba(255,255,255,.14) 50%, color-mix(in srgb, var(--accent2, var(--accent)) 26%, #ffffff) 53%, transparent 58%); animation: splash-sheen 3.2s ease-in-out infinite; pointer-events: none; }
          #dh-splash .splash-ring { position: relative; width: 148px; height: 148px; animation: splash-in .5s ease; }
          #dh-splash .splash-ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, #d9a441, #f4dfae, #a86f1f, #d9a441); animation: splash-spin 3s linear infinite; filter: blur(1px); }
          #dh-splash .splash-ring::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: #14100b; }
          #dh-splash .splash-logo { position: absolute; inset: 12px; width: 124px; height: 124px; border-radius: 50%; object-fit: cover; z-index: 1; box-shadow: 0 10px 34px rgba(0,0,0,.6); }
          #dh-splash h1 { margin: 10px 0 0; font-size: 36px; letter-spacing: .02em; background: linear-gradient(180deg, #fff8e8 25%, #f4dfae 60%, #d9a441 95%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 10px rgba(0,0,0,.6)); animation: splash-in .5s ease .1s both; }
          #dh-splash p { margin: 0; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: #d8c8b3; animation: splash-in .5s ease .2s both; }
          #dh-splash .splash-rule { width: 120px; height: 2px; background: linear-gradient(90deg, transparent, #d9a441, transparent); animation: splash-in .5s ease .25s both; }
          #dh-splash .splash-dots { display: flex; gap: 8px; margin-top: 14px; }
          #dh-splash .splash-dots i { width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f4dfae, #d9a441 70%); box-shadow: 0 0 10px rgba(217,164,65,.8); animation: splash-pulse 1.1s ease infinite; }
          #dh-splash .splash-dots i:nth-child(2) { animation-delay: .18s; }
          #dh-splash .splash-dots i:nth-child(3) { animation-delay: .36s; }
          @keyframes splash-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
          @keyframes splash-pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
          @keyframes splash-spin { to { transform: rotate(360deg); } }
          @keyframes splash-sheen { 0%, 100% { transform: translateX(-22%); } 50% { transform: translateX(22%); } }
          @media (prefers-reduced-motion: reduce) { #dh-splash .splash-ring, #dh-splash h1, #dh-splash p, #dh-splash .splash-rule { animation: none; } #dh-splash::before, #dh-splash .splash-ring::before { animation: none; } #dh-splash .splash-dots i { animation: none; opacity: .7; } }
        </style>
        <div class="splash-ring"><img class="splash-logo" src="/logo.jpg" alt="" /></div>
        <h1>The Daily Ham</h1>
        <div class="splash-rule"></div>
        <p>Fresh Cuts Daily</p>
        <div class="splash-dots"><i></i><i></i><i></i></div>
      </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
